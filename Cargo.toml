[package]
name = "sawmill"
version = "0.1.0"
authors = ["Spencer Thomason"]
edition = "2024"
rust-version = "1.88"
description = "Background logging for the log facade with a bounded queue and pluggable appenders"
license = "BSD-2-Clause"
repository = "https://github.com/ogital-net/sawmill"
readme = "README.md"
keywords = ["logging", "logger", "log", "appender"]
categories = ["development-tools::debugging"]
include = [
	"src/**",
	"tests/**",
	"examples/**",
	"benches/**",
	"scripts/**",
	"README.md",
	"LICENSE",
	"Cargo.toml",
]

[dependencies]
log = { version = "0.4", features = ["std"] }

[[bench]]
name = "contention"
harness = false
